services:
  mysql:
    image: mysql:8.0
    container_name: travel-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev}
      MYSQL_DATABASE: travel_planning
      MYSQL_USER: travel
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-travel_dev}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动执行建表与初始化数据
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_dev}"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ../backend
    container_name: travel-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://travel:${MYSQL_PASSWORD:-travel_dev}@mysql:3306/travel_planning?charset=utf8mb4
      # 开启后下载由前端 Nginx 直接发送（X-Accel-Redirect）
      NGINX_ACCEL: "true"
    ports:
      - "8000:8000"
    volumes:
      - export-data:/app/var/exports
      - file-data:/app/var/files
      - chunk-data:/app/var/chunks
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend/traveler
      args:
        VITE_API_BASE: /api/v1
    container_name: travel-frontend
    ports:
      - "8080:80"
    # 只读挂载文件卷，供 /_files/ internal location 直接发送
    volumes:
      - file-data:/srv/files:ro
    depends_on:
      - backend

volumes:
  mysql-data:
  export-data:
  file-data:
  chunk-data:
