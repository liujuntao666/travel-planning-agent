server {
    listen 80;
    server_name _;

    # 单分片默认 5MB；批量小文件接口上限放宽到 100MB
    client_max_body_size 100m;

    root /usr/share/nginx/html;
    index index.html;

    # 单页应用路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API：SSE 与文件上传/下载都需要关闭缓冲，避免整包缓存
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 内部文件直发：后端返回 X-Accel-Redirect，Nginx 用 sendfile 零拷贝发送，
    # Range / 206 由 Nginx 原生处理，并发下载不再占用 Python 进程
    location /_files/ {
        internal;
        alias /srv/files/;
        sendfile on;
        tcp_nopush on;
    }

    # 导出文件（PDF / 长图 / 微信长文）
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
