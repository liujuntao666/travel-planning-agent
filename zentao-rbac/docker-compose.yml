services:
  mysql:
    image: mysql:8.0
    container_name: zentao-rbac-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_dev
      MYSQL_DATABASE: zentao_rbac
      MYSQL_USER: rbac
      MYSQL_PASSWORD: rbac_dev
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-urbac", "-prbac_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    container_name: zentao-rbac-api
    environment:
      DATABASE_URL: mysql+pymysql://rbac:rbac_dev@mysql:3306/zentao_rbac?charset=utf8mb4
      AUTO_CREATE_TABLES: "false"
      SEED_ON_START: "false"
      APP_ENV: docker
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
